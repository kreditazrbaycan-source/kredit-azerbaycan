
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kredit Azərbaycan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }
    h1 { text-align: center; color: #174ea6; }
    p { line-height: 1.5; color: #444; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
    }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Kredit Azərbaycan</h1>
    <p>Kredit müraciətinizi göndərmək üçün aşağıdakı xanaları doldurun. Göndər düyməsinə basdıqda daxil etdiyiniz məlumatlar e-poçtla göndəriləcək.</p>

    <form id="creditForm">
      <label for="ad">Ad və soyad</label>
      <input id="ad" name="ad" required>

      <label for="telefon">Telefon nömrəsi</label>
      <input id="telefon" name="telefon" type="tel" required>

      <label for="mebleg">İstənilən kredit məbləği (₼)</label>
      <input id="mebleg" name="mebleg" type="number" min="1" required>

      <label for="qeyd">Əlavə qeyd (istəyə bağlı)</label>
      <textarea id="qeyd" name="qeyd" rows="3"></textarea>

      <label>
        <input id="raziliq" type="checkbox" required style="width:auto">
        Məlumatlarımın bu müraciət üçün göndərilməsinə razıyam.
      </label>

      <button id="sendButton" type="submit">Müraciəti göndər</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby8k2TTTrxTR-iaASIE8SafA2mN0zU8C_4jAcW7yElIVova11LeeeyMDC92p07UIpoG6Q/exec";

    const form = document.getElementById("creditForm");
    const statusBox = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!document.getElementById("raziliq").checked) {
        statusBox.textContent = "Zəhmət olmasa, razılıq verin.";
        return;
      }

      const data = {
        ad: document.getElementById("ad").value.trim(),
        telefon: document.getElementById("telefon").value.trim(),
        mebleg: document.getElementById("mebleg").value.trim(),
        qeyd: document.getElementById("qeyd").value.trim()
      };

      sendButton.disabled = true;
      statusBox.textContent = "Göndərilir...";

      try {
        await fetch(APP_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        statusBox.textContent =
          "Sorğu göndərildi. Gmail-ə çatdığını ayrıca yoxlayın.";
        form.reset();
      } catch (error) {
        statusBox.textContent =
          "Göndərmə alınmadı. İnternet bağlantısını və Apps Script ayarlarını yoxlayın.";
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
